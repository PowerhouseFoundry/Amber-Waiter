<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nando's | Table Service Training</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
 <header class="topbar">
  <div class="branding"><img src="assets/nandos-brand-header-v2.png" alt="Nando's"><span class="brand-caption">TABLE ORDERS <small>TRAINING</small></span></div>
  <div class="controls">
   <div class="mode-control" role="group" aria-label="Number of tables displayed"><button id="oneMode" class="mode-btn selected" aria-pressed="true">1 TABLE</button><button id="allMode" class="mode-btn" aria-pressed="false">ALL TABLES</button></div>
   <label class="level-label" for="level">LEVEL</label>
   <select id="level" aria-label="Training level"><option value="1">1 · PLATES / CLEAR</option><option value="2">2 · PLATES / CLEAR / CLEAN</option><option value="3">3 · DRINKS / CLEAR</option><option value="4">4 · DRINKS / CLEAR / CLEAN</option><option value="5">5 · DRINKS / FOOD / CLEAR</option><option value="6">6 · FULL SERVICE</option></select>
   <strong id="sessionClock" class="session-time">00:00</strong>
   <button id="stopBtn" class="stop">■ STOP</button>
  </div>
 </header>
 <main id="board" class="board one" aria-live="off"></main>
 <footer class="key"><span><i class="dot green"></i>0–19s</span><span><i class="dot amber"></i>20–39s</span><span><i class="dot red"></i>40–59s</span><span><i class="dot redpulse"></i>60s+</span><b>TAP THE PICTURE WHEN DONE</b></footer>
</div>
<div id="summary" class="overlay" hidden><section class="results" role="dialog" aria-modal="true" aria-labelledby="resultsTitle"><div class="results-head"><img src="assets/nandos-brand-header-v2.png" alt="Nando's"><h2 id="resultsTitle">SESSION COMPLETE</h2></div><div id="resultDetail" class="stats"></div><div class="summary-buttons"><button id="restartBtn" class="restart">START AGAIN</button></div></section></div>
<script src="app.js"></script>
</body></html>
