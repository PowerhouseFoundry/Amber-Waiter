<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nando's | Table Orders Training</title><link rel="stylesheet" href="style.css"></head><body>
<header class="top"><div class="brand"><img class="brand-logo" src="assets/nandos-logo.png" alt="Nando’s"><small>TABLE ORDERS</small></div><div class="controls"><label for="level">LEVEL</label><select id="level"><option value="1">1 · PLATES / CLEAR</option><option value="2">2 · PLATES / CLEAR / CLEAN</option><option value="3">3 · DRINKS / CLEAR</option><option value="4">4 · DRINKS / CLEAR / CLEAN</option><option value="5">5 · DRINKS + FOOD / CLEAR</option><option value="6">6 · FULL SERVICE</option></select><div class="runtime" id="runtime">00:00</div><button class="stop" id="stop">■ STOP</button></div></header>
<main id="board" class="board" aria-label="Four restaurant tables"></main>
<footer><span><i class="dot green"></i> 0–19s</span><span><i class="dot orange"></i> 20–39s</span><span><i class="dot red"></i> 40–59s</span><span><i class="dot overdue"></i> 60s+</span><span class="hint">TAP THE PICTURE WHEN DONE</span></footer>
<div id="summary" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="summaryTitle"><section class="results"><div class="result-head"><div class="brand"><img class="brand-logo" src="assets/nandos-logo.png" alt="Nando’s"></div><h1 id="summaryTitle">SESSION COMPLETE</h1><div id="sessionLevel"></div></div><div id="metrics" class="metrics"></div><div class="summary-actions"><button id="again" class="again">START AGAIN</button><button id="changeLevel" class="other">CHANGE LEVEL</button></div></section></div>
<div id="confirm" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="confirmTitle"><section class="prompt"><h2 id="confirmTitle">CHANGE LEVEL?</h2><p>This starts a new session. Current totals will be reset.</p><div class="summary-actions"><button id="cancel" class="other">CANCEL</button><button id="confirmYes" class="again">NEW SESSION</button></div></section></div>
<script src="app.js"></script></body></html>
